# Скопируйте в config.yaml и правьте под себя.
# Всё, чего здесь нет, берётся из значений по умолчанию (clipper/config.py).

twitch:
  game_name: "Grand Theft Auto VI"   # если Twitch назовёт игру иначе — `python -m clipper top` покажет ошибку
  # game_id: "12345"                 # можно указать напрямую

  auto_discover: true     # сам брать самые смотримые русские стримы по GTA 6
  languages: ["ru"]       # только русскоязычные стримы
  min_viewers: 5000       # только крупные стримеры
  top_n: 6                # сколько стримов писать одновременно (нагрузка на CPU/диск)
  refresh_seconds: 300

  # Ваши стримеры: пишутся всегда, когда они в эфире с GTA 6 или нет.
  # Логины сверяйте командой `python -m clipper top` — она покажет, кто сейчас в эфире.
  channels:
    # - buster
    # - exile
    # - mokrivskyi
    # - shadowkekw
    # - strogo
    # - evelone2004
  only_listed: false      # true — писать ТОЛЬКО стримеров из списка выше
  blacklist: []           # кого никогда не трогать

detector:
  trigger_ratio: 3.0          # чат в 3 раза быстрее обычного = момент
  min_window_messages: 25     # и минимум 25 сообщений за 12 секунд
  min_reaction_share: 0.15    # и ≥15% сообщений — реакции (KEKW, ахах, WTF, +…)
  cooldown_seconds: 90        # не чаще одного клипа в 1.5 минуты на стримера

audio:                        # стример закричал / засмеялся
  enabled: true
  delta_db: 10          # на сколько дБ громче обычного (меньше — чаще срабатывает)
  require_chat: true    # засчитывать, только если оживился и чат
  confirm_ratio: 1.5

viewer_clips:                 # клипы, которые нарезали сами зрители на Twitch
  enabled: true

scoring:                      # бесплатная оценка момента 0–100 по чату и звуку
  min_score: 45         # меньше — больше клипов, больше — только самые яркие
  max_per_hour: 4       # не больше стольких клипов в час на стримера

clip:
  pre_roll: 25    # сколько секунд ДО всплеска брать (чат реагирует с опозданием)
  post_roll: 6
  max_seconds: 59

render:
  # split — стример крупным планом сверху, игра снизу, субтитры между ними.
  #         Лицо стримера программа находит сама. Если в клипе лица нет — делает blur.
  # blur  — кадр стрима целиком на размытом фоне;  crop — просто центр кадра
  layout: split
  split_top_ratio: 0.42   # какую часть высоты отдать под стримера
  face_zoom: 4.0          # меньше — крупнее лицо (но мыльнее), больше — видно плечи и комнату
  watermark: ""           # например "@gta6_moments"
  subtitles: false        # true — вшивать субтитры в видео; false — чистое видео + subtitles.srt
  # Если автопоиск ошибается у какого-то стримера — задайте область вручную
  # (доли кадра: x, y, ширина, высота):
  facecams:
    # evelone2004: [0.0, 0.55, 0.2, 0.3]

transcribe:
  model: medium     # точнее small, но медленнее; на слабом CPU — small; с видеокартой — large-v3
  language: ru
  drop_foreign_speech: true   # не делать субтитры из английской речи персонажей игры

titles:
  enabled: true     # нужен ANTHROPIC_API_KEY в .env; без него — шаблонные заголовки
  model: claude-opus-5-5
  effort: low
  language: ru

output:
  dir: data/clips
